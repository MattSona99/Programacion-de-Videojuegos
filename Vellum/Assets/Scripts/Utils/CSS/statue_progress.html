<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statue Progress — Cilindro vetroso, liquido rosso Jammo</title>

    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>

    <style>
        :root {
            --cyl-w: 120px;
            --cyl-h: 600px;
            --cap-h: 36px;

            /* Vetro grigio chiaro semi-trasparente */
            --glass-light: rgba(220, 226, 232, 0.45);
            --glass-shadow: rgba(140, 148, 158, 0.25);
            --glass-edge: rgba(80, 88, 100, 0.55);
            --glass-highlight: rgba(255, 255, 255, 0.35);

            /* Rosso Jammo */
            --liquid-dark: #8b1c14;
            --liquid-base: #d8362a;
            --liquid-light: #ff7860;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 60px 0;
            gap: 80px;
            font-family: 'Lilita One', cursive;
            color: #eee;
        }

        .col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .label { font-size: 18px; letter-spacing: 1px; }

        .capture {
            width: var(--cyl-w);
            height: calc(var(--cyl-h) + var(--cap-h));
            position: relative;
            background: transparent;
        }

        /* ============================================================
           CILINDRO VUOTO (BG) — vetro grigio chiaro trasparente
           ============================================================ */
        .cyl-bg .top-cap {
            position: absolute;
            top: 0; left: 0;
            width: var(--cyl-w);
            height: var(--cap-h);
            border-radius: 50%;
            background:
                radial-gradient(ellipse at 50% 65%, var(--glass-highlight) 0%, var(--glass-light) 45%, var(--glass-shadow) 100%);
            border: 2px solid var(--glass-edge);
            box-shadow: inset 0 4px 8px rgba(255,255,255,0.25), inset 0 -3px 6px rgba(0,0,0,0.15);
            z-index: 3;
        }
        .cyl-bg .body {
            position: absolute;
            top: calc(var(--cap-h) / 2);
            left: 0;
            width: var(--cyl-w);
            height: var(--cyl-h);
            background:
                /* riflessi laterali del vetro (curvatura) */
                linear-gradient(to right,
                    rgba(255,255,255,0.30) 0%,
                    rgba(255,255,255,0.05) 20%,
                    rgba(0,0,0,0.08) 50%,
                    rgba(255,255,255,0.05) 80%,
                    rgba(255,255,255,0.20) 100%),
                linear-gradient(to bottom, var(--glass-light) 0%, var(--glass-shadow) 100%);
            border-left: 2px solid var(--glass-edge);
            border-right: 2px solid var(--glass-edge);
            z-index: 2;
        }
        .cyl-bg .bottom-cap {
            position: absolute;
            top: calc(var(--cyl-h) + var(--cap-h) / 2);
            left: 0;
            width: var(--cyl-w);
            height: var(--cap-h);
            border-radius: 50%;
            background:
                radial-gradient(ellipse at 50% 35%, var(--glass-shadow) 0%, rgba(110, 118, 128, 0.35) 70%, rgba(70, 78, 88, 0.45) 100%);
            border: 2px solid var(--glass-edge);
            box-shadow: inset 0 -4px 8px rgba(0,0,0,0.25);
            z-index: 1;
        }

        /* ============================================================
           LIQUIDO PIENO (FILL) — rosso Jammo
           ============================================================ */
        .cyl-fill .body {
            position: absolute;
            top: calc(var(--cap-h) / 2);
            left: 0;
            width: var(--cyl-w);
            height: var(--cyl-h);
            background:
                linear-gradient(to right,
                    rgba(255,255,255,0.28) 0%,
                    rgba(255,255,255,0.00) 28%,
                    rgba(0,0,0,0.18) 70%,
                    rgba(0,0,0,0.05) 100%),
                linear-gradient(to top, var(--liquid-dark) 0%, var(--liquid-base) 55%, var(--liquid-light) 100%);
        }
        .cyl-fill .meniscus {
            position: absolute;
            top: calc(var(--cap-h) / 2);
            left: 0;
            width: var(--cyl-w);
            height: 14px;
            background: linear-gradient(to bottom,
                rgba(255,255,255,0.85) 0%,
                rgba(255,178,160,0.55) 55%,
                rgba(255,120,96,0) 100%);
            box-shadow: 0 2px 4px rgba(80,10,5,0.35);
        }

        /* ============================================================
           ELLISSE DEL LIVELLO (asset separato)
           Esportato come PNG dedicato e mosso dinamicamente in UI a
           coprire la linea retta di taglio del fillAmount. La sprite va
           "centrata" sul livello del liquido (metà sotto, metà sopra il
           taglio), così l'occhio percepisce una superficie ovale.
           ============================================================ */
        .cap-fill {
            width: var(--cyl-w);
            height: var(--cap-h);
            border-radius: 50%;
            background:
                /* riflesso bianco in cima per dare il senso di "specchio" del liquido */
                radial-gradient(ellipse at 50% 30%, rgba(255,255,255,0.9) 0%, rgba(255,178,160,0.5) 30%, rgba(255,120,96,0) 70%),
                /* gradient di colore base del liquido (chiaro in cima → base sotto) */
                radial-gradient(ellipse at 50% 55%, var(--liquid-light) 0%, var(--liquid-base) 55%, var(--liquid-dark) 100%);
            box-shadow: 0 3px 6px rgba(80, 10, 5, 0.30);
        }

        /* ============================================================ */

        button.download {
            padding: 12px 22px;
            background: #FF5252;
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #b71c1c;
            font-family: sans-serif;
            font-size: 14px;
            transition: transform 0.1s;
        }
        button.download:active { transform: translateY(4px); box-shadow: 0 0 0; }
    </style>
</head>
<body>

    <div class="col">
        <span class="label">SFONDO (cilindro vetroso)</span>
        <div id="capture-bg" class="capture cyl-bg">
            <div class="bottom-cap"></div>
            <div class="body"></div>
            <div class="top-cap"></div>
        </div>
        <button class="download" onclick="exportImage('capture-bg', 'statue_progress_bg.png', this)">📸 Scarica BG</button>
    </div>

    <div class="col">
        <span class="label">RIEMPIMENTO (rosso Jammo)</span>
        <div id="capture-fill" class="capture cyl-fill">
            <div class="body"></div>
            <div class="meniscus"></div>
        </div>
        <button class="download" onclick="exportImage('capture-fill', 'statue_progress_fill.png', this)">📸 Scarica Fill</button>
    </div>

    <div class="col">
        <span class="label">ELLISSE LIVELLO (cap dinamico)</span>
        <div id="capture-cap" class="cap-fill"></div>
        <button class="download" onclick="exportImage('capture-cap', 'statue_progress_cap.png', this)">📸 Scarica Cap</button>
    </div>

    <script>
        function exportImage(nodeId, filename, btn) {
            const node = document.getElementById(nodeId);
            const oldText = btn.innerText;
            btn.innerText = "Esportazione...";

            domtoimage.toPng(node, {
                width: node.scrollWidth,
                height: node.scrollHeight,
                bgcolor: null
            })
            .then(function (dataUrl) {
                var link = document.createElement('a');
                link.download = filename;
                link.href = dataUrl;
                link.click();
                btn.innerText = "✅ FATTO!";
                setTimeout(() => btn.innerText = oldText, 1500);
            })
            .catch(function (error) {
                console.error('Errore:', error);
                btn.innerText = "❌ ERRORE";
            });
        }
    </script>
</body>
</html>
