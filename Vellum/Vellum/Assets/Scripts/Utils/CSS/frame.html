<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Fantasy Frame - White & Teal</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>

    <style>
        :root {
            /* Nuova Palette: Bianco scettro, Argento, Azzurro Magico */
            --color-primary: #ffffff;
            --color-secondary: #b0bec5; /* Grigio/Argento elegante */
            --color-magic-glow: #4ffffa; /* Azzurro magico mantenuto */
            --color-magic-core: #ffffff;
            --color-frame-bg: #1a1c23; /* Sfondo scuro per far risaltare il bianco */
        }

        /* Sfondo a scacchi per l'anteprima (non verrà esportato) */
        body {
            background-color: #222;
            background-image: 
                linear-gradient(45deg, #333 25%, transparent 25%), 
                linear-gradient(-45deg, #333 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #333 75%), 
                linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        .main-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* --- L'AREA DI CATTURA (Trasparenza pura) --- */
        #capture-area {
            position: relative;
            padding: 30px; /* Ridotto il padding perché il frame è più snello */
            background-color: transparent !important; 
        }

        /* --- DESIGN DEL FRAME (Sottile e minimalista) --- */
        .health-frame {
            position: relative;
            width: 500px; /* IL BUCO ESATTO - 100% VUOTO */
            height: 50px;
            box-sizing: content-box; 
            background-color: transparent !important;
            
            /* Bordi molto più sottili (2px sopra/sotto, 8px ai lati) */
            border-style: solid;
            border-width: 2px 8px; 
            border-color: var(--color-secondary) var(--color-primary) var(--color-secondary) var(--color-primary);
            border-radius: 4px; /* Curve più dolci */
            
            /* Ombre e bagliori alleggeriti */
            box-shadow: 
                0 0 0 1px rgba(0,0,0,0.8), /* Sottilissimo filo nero esterno per definizione */
                0 0 15px rgba(79, 255, 250, 0.4), /* Bagliore azzurro più soffuso */
                inset 0 0 0 1px rgba(0,0,0,0.8); /* Filo nero interno non invasivo */
        }

        /* Decorazioni d'angolo rimpicciolite e arrotondate */
        .corner-decor {
            position: absolute;
            width: 14px;
            height: 14px;
            background-color: var(--color-frame-bg);
            border: 2px solid var(--color-primary);
            border-radius: 50%; /* Rese circolari per maggiore eleganza */
            box-shadow: 0 0 8px var(--color-magic-glow);
            z-index: 3;
        }

        /* Diamante magico interno */
        .corner-decor::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 6px; height: 6px;
            background-color: var(--color-magic-glow);
            box-shadow: 0 0 5px var(--color-magic-core);
        }

        /* Posizioni adattate alle nuove dimensioni ridotte */
        .c-tl { top: -8px; left: -14px; }
        .c-tr { top: -8px; right: -14px; }
        .c-bl { bottom: -8px; left: -14px; }
        .c-br { bottom: -8px; right: -14px; }

        /* Elemento ornamentale centrale snellito */
        .center-ornament {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 10px;
            background-color: var(--color-frame-bg);
            border: 2px solid var(--color-primary);
            border-top: none;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5), 0 2px 8px rgba(79, 255, 250, 0.3);
            z-index: 2;
        }
        /* Linea di luce centrale */
        .center-ornament::after {
            content: '';
            position: absolute;
            top: 2px; left: 50%;
            transform: translateX(-50%);
            width: 20px; height: 3px;
            background-color: var(--color-magic-glow);
            border-radius: 5px;
            box-shadow: 0 0 5px var(--color-magic-core);
        }

        /* --- BOTTONE INTERFACCIA --- */
        #download-btn {
            padding: 12px 30px;
            background: #ffffff;
            color: #000;
            border: 2px solid var(--color-magic-glow);
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 255, 250, 0.3);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #download-btn:hover {
            box-shadow: 0 6px 20px rgba(79, 255, 250, 0.6);
            transform: translateY(-2px);
            background: #f0f8ff;
        }
        #download-btn:active {
            transform: translateY(1px);
        }
        
        .info-box {
            background: rgba(0,0,0,0.8);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="info-box">
            <h2 style="margin-top: 0; color: #fff;">Frame Minimalista <span style="color: var(--color-magic-glow);">Azzurro</span> & Bianco</h2>
            <p style="color: #ccc; margin-bottom: 0;">Meno invasivo, trasparenza assoluta nel centro.</p>
        </div>

        <button id="download-btn" onclick="salvaImmagine()">📸 SCARICA IL FRAME IN PNG</button>

        <div id="capture-area">
            <div class="health-frame">
                <div class="corner-decor c-tl"></div>
                <div class="corner-decor c-tr"></div>
                <div class="corner-decor c-bl"></div>
                <div class="corner-decor c-br"></div>
                <div class="center-ornament"></div>
            </div>
        </div>
    </div>

    <script>
        function salvaImmagine() {
            const areaDaCatturare = document.getElementById('capture-area');
            const bottoneDownload = document.getElementById('download-btn');
            
            bottoneDownload.innerText = "⏳ Creazione in corso...";
            
            // Forza la trasparenza assoluta
            const options = {
                backgroundColor: null,
                style: {
                    background: 'transparent'
                }
            };

            domtoimage.toPng(areaDaCatturare, options)
                .then(function (dataUrl) {
                    var link = document.createElement('a');
                    link.download = 'Minimal_HealthBar_Frame.png';
                    link.href = dataUrl;
                    link.click();
                    
                    bottoneDownload.innerText = "✅ FRAME SCARICATO!";
                    setTimeout(() => bottoneDownload.innerText = "📸 SCARICA IL FRAME IN PNG", 2000);
                })
                .catch(function (error) {
                    console.error('Errore!', error);
                    bottoneDownload.innerText = "❌ ERRORE";
                });
        }
    </script>

</body>
</html>
